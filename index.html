<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f3f4ee">
    <title>Список задач</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="task-card" aria-labelledby="page-title">
      <header class="card-header">
        <p class="eyebrow">Шаг за шагом</p>
        <h1 id="page-title">Список задач</h1>
        <p class="intro">Освободите мысли. Запишите то, что хотите сделать.</p>
      </header>

      <form id="task-form" class="task-form">
        <label for="task-input">Новая задача</label>
        <div class="input-row">
          <input id="task-input" name="task" type="text" placeholder="Что нужно сделать?" autocomplete="off" required>
          <button class="add-button" type="submit">Добавить</button>
        </div>
      </form>

      <p id="storage-error" class="storage-error" role="alert" hidden>Не удалось сохранить задачи. Изменения доступны только до закрытия страницы.</p>

      <section class="tasks" aria-label="Ваши задачи">
        <ul id="task-list" class="task-list"></ul>
        <div id="empty-state" class="empty-state">
          <span class="empty-symbol" aria-hidden="true">✓</span>
          <p class="empty-title">Здесь появятся ваши задачи</p>
          <p>Добавьте первую — и начните с малого.</p>
        </div>
      </section>
    </main>
  </body>
</html>
